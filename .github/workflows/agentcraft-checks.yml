name: AgentCraft checks

on:
  push:
    branches: [main, 'agentcraft/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Test the PR validation rules
        run: python3 -m unittest discover -s scripts/tests
      - name: Validate formatting, changed files and diff limits
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/agentcraft_checks.py --base "$BASE_REF" --head "$HEAD_REF"
      - name: Scan changed history for secrets
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          printf 'title = "Trusted CI secret scan"\n[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"
          "$RUNNER_TEMP/gitleaks" git --config "$RUNNER_TEMP/gitleaks.toml" --gitleaks-ignore-path /dev/null --ignore-gitleaks-allow --redact --no-banner --no-color --log-opts "$BASE_REF..$HEAD_REF" . 2> "$RUNNER_TEMP/gitleaks.log"
          if grep -Eq '\b(ERR|FTL)\b' "$RUNNER_TEMP/gitleaks.log"; then
            echo 'Secret scan could not inspect Git history.'
            exit 1
          fi
